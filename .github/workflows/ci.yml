name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server

  data:
    name: Shared data (JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install check-jsonschema
      - run: check-jsonschema --schemafile shared/schemas/monsters.schema.json shared/monsters.json
      - run: check-jsonschema --schemafile shared/schemas/player.schema.json shared/player.json
      - run: check-jsonschema --schemafile shared/schemas/combat.schema.json shared/combat.json
      - run: check-jsonschema --schemafile shared/schemas/items.schema.json shared/items.json
      - run: check-jsonschema --schemafile shared/schemas/loot_tables.schema.json shared/loot_tables.json
      - run: check-jsonschema --schemafile shared/schemas/skills.schema.json shared/skills.json
      - run: check-jsonschema --schemafile shared/schemas/progression.schema.json shared/progression.json

  game:
    name: Game (Godot domain tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gdUnit4 action downloads Godot + the gdUnit4 framework and runs the
      # headless test runner. Report publishing is off: it needs checks:write,
      # and this workflow deliberately runs with contents:read only.
      - name: Run domain tests (headless)
        uses: MikeSchulze/gdUnit4-action@v1.3.2
        with:
          godot-version: "4.5"
          godot-status: "stable"
          version: "latest"
          project_dir: "game"
          paths: "res://tests"
          timeout: 10
          publish-report: false
